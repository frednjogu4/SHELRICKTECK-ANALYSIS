name: CI

# Verification only. This workflow never deploys, holds no Cloudflare token and
# needs no secrets: `wrangler deploy --dry-run` bundles the Worker and stops
# before anything is uploaded. Deployments stay a manual, approved step.
#
# The Node tests run with outbound network access blocked
# (scripts/test-network-guard.mjs) and the Python bridge tests use in-test
# fakes, so a CI run never contacts a broker or a market-data provider.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, dry-run (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is what docs/README ask for; 24 is the Workers Builds default.
        node: [22, 24]
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exactly what package-lock.json pins
        run: npm ci --no-fund

      # Reported, never blocking: a newly published advisory must not turn an
      # unrelated commit red. Fix with 'npm audit fix' when the warning appears.
      - name: Security advisories (warning only)
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning title=npm audit::npm reports high or critical advisories (or the registry could not be reached). Run 'npm audit' locally."
          fi

      # build -> smoke + node:test suites -> Worker in the real workerd runtime
      # -> wrangler deploy --dry-run (which re-checks dist/ first).
      - name: Build, test and dry-run the deployment
        run: npm run verify

      - name: Committed dist/ matches a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo "::warning title=dist/ is out of date::dist/index.html or dist/AURUM_Workspace.html in Git differs from a fresh build. Run 'npm run build' and commit the result."
            git diff --stat -- dist
          fi

  bridge:
        # The PC bridge tests use only the Python standard library: MetaTrader5 and
    # websockets are replaced by in-test fakes, so nothing is installed and
    # neither a broker nor the network is contacted.
    name: PC bridge tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax check
        run: python -m compileall -q bridge tests

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
